<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tapout — Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 96px; box-sizing: border-box; padding: 0 24px 32px; display: flex; align-items: flex-end">
  <nav aria-label="Tabs" style="flex-grow: 1; height: 64px; box-sizing: border-box; padding: 8px; border-radius: 999px; background: {{t.s1}}; box-shadow: {{t.shadow}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <button type="button" aria-label="Home" aria-current="{{a.home.cur}}" style="border: 0; border-radius: 999px; background: {{a.home.bg}}; color: {{a.home.fg}}; display: grid; place-items: center; padding: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="10" stroke-dasharray="3 3"/></svg>
    </button>
    <button type="button" aria-label="Modes" aria-current="{{a.modes.cur}}" style="border: 0; border-radius: 999px; background: {{a.modes.bg}}; color: {{a.modes.fg}}; display: grid; place-items: center; padding: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
    <button type="button" aria-label="Places" aria-current="{{a.places.cur}}" style="border: 0; border-radius: 999px; background: {{a.places.bg}}; color: {{a.places.fg}}; display: grid; place-items: center; padding: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
    </button>
    <button type="button" aria-label="Insights" aria-current="{{a.insights.cur}}" style="border: 0; border-radius: 999px; background: {{a.insights.bg}}; color: {{a.insights.fg}}; display: grid; place-items: center; padding: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 19v-6M12 19V6M18 19v-9"/></svg>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","modes","places","insights"],"default":"home"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.theme === 'light';
    const t = light ? { s1:'#fffdf9', s2:'#ece8e0', ink:'#15171b', ink3:'#5f656f', shadow:'0 4px 20px #15171b1a' } : { s1:'#15181d', s2:'#1e222a', ink:'#f3f1ec', ink3:'#8a919c', shadow:'0 8px 24px #00000066' };
    const act = this.props.active ?? 'home';
    const a = {};
    ['home','modes','places','insights'].forEach((k) => { const on = k === act; a[k] = { bg: on ? t.s2 : 'rgba(0,0,0,0)', fg: on ? t.ink : t.ink3, cur: on ? 'page' : 'false' }; });
    return { t, a };
  }
}
</script>
</body>
</html>
