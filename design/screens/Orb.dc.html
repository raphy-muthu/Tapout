<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tapout — Glass orb</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="{{label}}" style="position: relative; width: {{o.px}}; height: {{o.px}}; flex-shrink: 0">
  <div style="position: absolute; left: {{o.glowPos}}; top: {{o.glowPos}}; width: {{o.glowSize}}; height: {{o.glowSize}}; border-radius: 50%; background: {{o.glow}}; pointer-events: none"></div>
  <div style="position: absolute; left: {{o.sp}}; top: {{o.sp}}; width: {{o.sd}}; height: {{o.sd}}; border-radius: 50%; background: {{o.body}}; box-shadow: {{o.shadow}}"></div>
  <div style="position: absolute; left: {{o.sp}}; top: {{o.sp}}; width: {{o.sd}}; height: {{o.sd}}; border-radius: 50%; background: {{o.gloss}}"></div>
  <sc-if value="{{o.hasRing}}" hint-placeholder-val="{{false}}">
    <svg width="{{o.size}}" height="{{o.size}}" viewBox="0 0 {{o.size}} {{o.size}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible; filter: {{o.ringGlow}}">
      <circle cx="{{o.c}}" cy="{{o.c}}" r="{{o.r}}" fill="none" stroke="{{o.track}}" stroke-width="{{o.sw}}"></circle>
      <circle cx="{{o.c}}" cy="{{o.c}}" r="{{o.r}}" fill="none" stroke="{{o.ring}}" stroke-width="{{o.sw}}" stroke-linecap="round" stroke-dasharray="{{o.dash}}" stroke-dashoffset="{{o.off}}" transform="rotate(-90 {{o.c}} {{o.c}})"></circle>
    </svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tone":{"editor":"enum","options":["ember","slate"],"default":"ember"},"ring":{"editor":"range","min":0,"max":1,"step":0.05,"default":1},"ringTone":{"editor":"enum","options":["auto","ember","slate"],"default":"auto"},"size":{"editor":"int","min":40,"max":900,"default":320},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":320,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size ?? 320);
    const tone = this.props.tone === 'slate' ? 'slate' : 'ember';
    const light = this.props.theme === 'light';
    const ring = Math.max(0, Math.min(1, Number(this.props.ring ?? (tone === 'ember' ? 1 : 0))));
    const rt = (this.props.ringTone && this.props.ringTone !== 'auto') ? this.props.ringTone : tone;
    const C = {
      ember: { hi: '#ffe3c4', mid: '#ff9f43', deep: '#c0600f', edge: light ? '#8a3f06' : '#3d1702', glowRgb: '255,159,67', ga: light ? 0.42 : 0.5 },
      slate: { hi: '#eef1f6', mid: '#9aa3b4', deep: '#555e70', edge: light ? '#4a5263' : '#141820', glowRgb: '138,148,166', ga: light ? 0.32 : 0.34 }
    }[tone];
    const lineCol = rt === 'ember' ? (light ? '#c2650f' : '#ff9f43') : (light ? '#6b7487' : '#8a94a6');
    const glowCol = rt === 'ember' ? '255,159,67' : '138,148,166';
    const sp = size * 0.13, sd = size - 2 * sp;
    const sw = Math.max(2.5, size * 0.016);
    const r = size / 2 - sw * 1.5;
    const circ = 2 * Math.PI * r;
    const px = (n) => n.toFixed(1) + 'px';
    const o = {
      size, px: px(size), sp: px(sp), sd: px(sd),
      glowPos: px(-size * 0.22), glowSize: px(size * 1.44),
      glow: 'radial-gradient(circle, rgba(' + C.glowRgb + ',' + C.ga + ') 0%, rgba(' + C.glowRgb + ',' + (C.ga * 0.35).toFixed(2) + ') 38%, rgba(' + C.glowRgb + ',0) 68%)',
      body: 'radial-gradient(ellipse 70% 34% at 50% 92%, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0) 70%), radial-gradient(circle at 50% 58%, ' + C.hi + ' 0%, ' + C.mid + ' 34%, ' + C.deep + ' 72%, ' + C.edge + ' 100%)',
      gloss: 'radial-gradient(ellipse 30% 20% at 35% 24%, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.35) 45%, rgba(255,255,255,0) 100%), radial-gradient(ellipse 12% 7% at 66% 78%, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%)',
      shadow: 'inset 0 0 0 1px rgba(255,255,255,0.22), inset 0 ' + px(-sd * 0.05) + ' ' + px(sd * 0.1) + ' rgba(255,255,255,0.14), inset 0 ' + px(sd * 0.06) + ' ' + px(sd * 0.12) + ' rgba(0,0,0,0.28), 0 ' + px(sd * 0.08) + ' ' + px(sd * 0.18) + ' ' + (light ? 'rgba(21,23,27,0.18)' : 'rgba(0,0,0,0.5)'),
      hasRing: ring > 0,
      c: size / 2, r, sw, ring: lineCol,
      track: ring < 1 ? (light ? 'rgba(21,23,27,0.08)' : 'rgba(255,255,255,0.08)') : 'rgba(0,0,0,0)',
      dash: circ.toFixed(1), off: (circ * (1 - ring)).toFixed(1),
      ringGlow: 'drop-shadow(0 0 ' + px(size * 0.025) + ' rgba(' + glowCol + ',0.7))'
    };
    const label = tone === 'ember' ? (ring >= 1 ? 'Sealed ember orb' : 'Ember orb') : 'Slate orb';
    return { o, label };
  }
}
</script>
</body>
</html>
