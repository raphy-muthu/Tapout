<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tapout — Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Nunito:wght@200;300;400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px; padding: 56px 24px 40px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: {{t.s1}}; box-shadow: {{t.shadow}}; color: {{t.ink2}}; display: grid; place-items: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span style="font-size: 17px; line-height: 22px; font-weight: 600">Settings</span>
    <span style="width: 44px"></span>
  </div>

  <sc-if value="{{locked}}" hint-placeholder-val="{{false}}">
    <div role="status" style="background: {{t.emberGlow}}; border-radius: 24px; padding: 16px 20px; display: flex; align-items: center; gap: 12px; color: {{t.emberInk}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span style="display: flex; flex-direction: column"><span style="font-size: 17px; line-height: 22px; font-weight: 600">View only while locked</span><span style="font-size: 13px; line-height: 18px; color: {{t.ink2}}">Tap a tag to make changes.</span></span>
    </div>
  </sc-if>

  <div style="background: {{t.s1}}; box-shadow: {{t.shadow}}; border-radius: 24px; padding: 20px; display: flex; align-items: center; justify-content: space-between">
    <span style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 17px; line-height: 22px; font-weight: 600">Emergency passes</span>
      <span style="display: flex; gap: 6px" aria-hidden="true">
        <span style="width: 24px; height: 8px; border-radius: 999px; background: #ff9f43"></span>
        <span style="width: 24px; height: 8px; border-radius: 999px; background: #ff9f43"></span>
        <span style="width: 24px; height: 8px; border-radius: 999px; background: #ff9f43"></span>
        <span style="width: 24px; height: 8px; border-radius: 999px; background: {{t.s2}}"></span>
        <span style="width: 24px; height: 8px; border-radius: 999px; background: {{t.s2}}"></span>
      </span>
    </span>
    <span style="font-family: ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif; font-size: 28px; line-height: 32px">[3]<span style="font-size: 17px; color: {{t.ink3}}">/5</span></span>
  </div>

  <div style="background: {{t.s1}}; box-shadow: {{t.shadow}}; border-radius: 24px; padding: 4px 20px; display: flex; flex-direction: column">
    <button type="button" disabled="{{locked}}" style="height: 56px; border: 0; background: none; padding: 0; color: {{t.ink}}; display: flex; align-items: center; justify-content: space-between; font: 400 17px/22px -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
      <span>Places</span><span style="display: inline-flex; align-items: center; gap: 6px; color: {{t.ink2}}">[4]<sc-if value="{{locked}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Locked"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></sc-if><sc-if value="{{open}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></sc-if></span>
    </button>
    <button type="button" disabled="{{locked}}" style="height: 56px; border: 0; background: none; padding: 0; color: {{t.ink}}; display: flex; align-items: center; justify-content: space-between; font: 400 17px/22px -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
      <span>Modes</span><span style="display: inline-flex; align-items: center; gap: 6px; color: {{t.ink2}}">[4]<sc-if value="{{locked}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Locked"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></sc-if><sc-if value="{{open}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></sc-if></span>
    </button>
    <button type="button" disabled="{{locked}}" style="height: 56px; border: 0; background: none; padding: 0; color: {{t.ink}}; display: flex; align-items: center; justify-content: space-between; font: 400 17px/22px -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">
      <span>Always allowed</span><span style="display: inline-flex; align-items: center; gap: 6px; color: {{t.ink2}}">[3] apps<sc-if value="{{locked}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Locked"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></sc-if><sc-if value="{{open}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></sc-if></span>
    </button>
  </div>

  <div style="background: {{t.s1}}; box-shadow: {{t.shadow}}; border-radius: 24px; padding: 4px 20px; display: flex; flex-direction: column">
    <div style="height: 56px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 17px; line-height: 22px">Haptics</span>
      <button type="button" role="switch" aria-checked="true" aria-label="Haptics" disabled="{{locked}}" style="width: 52px; height: 32px; border: 0; padding: 2px; border-radius: 999px; background: {{toggleOn}}; display: flex; justify-content: flex-end; opacity: {{ctlOp}}"><span style="width: 28px; height: 28px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 3px #00000040"></span></button>
    </div>
    <div style="height: 56px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 17px; line-height: 22px">Live Activity</span>
      <button type="button" role="switch" aria-checked="true" aria-label="Live Activity" disabled="{{locked}}" style="width: 52px; height: 32px; border: 0; padding: 2px; border-radius: 999px; background: {{toggleOn}}; display: flex; justify-content: flex-end; opacity: {{ctlOp}}"><span style="width: 28px; height: 28px; border-radius: 50%; background: #ffffff; box-shadow: 0 1px 3px #00000040"></span></button>
    </div>
    <div style="height: 56px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 17px; line-height: 22px">Appearance</span>
      <span style="font-size: 17px; line-height: 22px; color: {{t.ink2}}">System</span>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <span style="text-align: center; font-size: 13px; line-height: 18px; color: {{t.ink3}}">Tapout [1.0]</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"locked":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      dark: { bg:'#0b0d10', s1:'#15181d', s2:'#1e222a', ink:'#f3f1ec', ink2:'#a4abb6', ink3:'#8a919c', emberInk:'#ff9f43', emberGlow:'#ff9f431f', shadow:'none' },
      light: { bg:'#f6f4ef', s1:'#fffdf9', s2:'#ece8e0', ink:'#15171b', ink2:'#565c66', ink3:'#5f656f', emberInk:'#96490a', emberGlow:'#ff9f432e', shadow:'0 2px 12px #0000000f' }
    };
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const locked = this.props.locked === true || this.props.locked === 'true';
    const t = P[theme];
    return { t, locked, open: !locked, ctlOp: locked ? 0.45 : 1, toggleOn: locked ? t.ink3 : (theme === 'light' ? '#535c6c' : '#8a94a6') };
  }
}
</script>
</body>
</html>
