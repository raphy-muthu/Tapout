name: Tapout
options:
  bundleIdPrefix: com.raphymuthu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: HM34P4HC4F
    CODE_SIGN_STYLE: Automatic
targets:
  Tapout:
    type: application
    platform: iOS
    sources:
      - path: Tapout
      - path: Shared
      - path: Surfaces
    dependencies:
      - target: TapoutMonitor
      - target: TapoutShield
      - target: TapoutWidgets
    info:
      path: Tapout/Info.plist
      properties:
        CFBundleDisplayName: Tapout
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: bg
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Fraunces-TapoutDisplay.ttf
          - Fraunces-TapoutNumber.ttf
          - Fraunces-TapoutTitle.ttf
          - Fraunces-TapoutDisplayBold.ttf
          - Fraunces-TapoutNumberBold.ttf
          - Fraunces-TapoutTitleBold.ttf
        NFCReaderUsageDescription: Tapout reads your tag to lock and unlock your apps.
        # Core NFC drops ISO 7816 tags without this list. This AID is the standard NDEF
        # application; Tapout only reads the tag's UID.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers:
          - D2760000850101
    entitlements:
      path: Tapout/Tapout.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.raphymuthu.tapout
        com.apple.developer.nfc.readersession.formats:
          - TAG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raphymuthu.tapout
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: "" # app icon arrives with the AppIcon screen
  TapoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TapoutTests
    dependencies:
      - target: Tapout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raphymuthu.tapout.tests
        GENERATE_INFOPLIST_FILE: YES
  TapoutMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: TapoutMonitor
      - path: Shared
    info:
      path: TapoutMonitor/Info.plist
      properties:
        CFBundleDisplayName: Tapout Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TapoutMonitor
    entitlements:
      path: TapoutMonitor/TapoutMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.raphymuthu.tapout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raphymuthu.tapout.monitor
        TARGETED_DEVICE_FAMILY: "1"
  TapoutShield:
    type: app-extension
    platform: iOS
    sources:
      - path: TapoutShield
      - path: Tapout/DesignSystem/Colors.xcassets
    info:
      path: TapoutShield/Info.plist
      properties:
        CFBundleDisplayName: Tapout Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: TapoutShield/TapoutShield.entitlements
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raphymuthu.tapout.shield
        TARGETED_DEVICE_FAMILY: "1"
  TapoutWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TapoutWidgets
      - path: Surfaces
      - path: Shared
      - path: Tapout/DesignSystem/Colors.xcassets
      - path: Tapout/DesignSystem/Fonts
      - path: Tapout/DesignSystem/Color+Tokens.swift
      - path: Tapout/DesignSystem/Layout.swift
      - path: Tapout/DesignSystem/FrauncesFace.swift
      - path: Tapout/DesignSystem/Typography.swift
      - path: Tapout/Components/OrbView.swift
      - path: Tapout/Model/TimeFormat.swift
      - path: Tapout/Model/Insights.swift
    info:
      path: TapoutWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tapout
        UIAppFonts:
          - Fraunces-TapoutDisplay.ttf
          - Fraunces-TapoutNumber.ttf
          - Fraunces-TapoutTitle.ttf
          - Fraunces-TapoutDisplayBold.ttf
          - Fraunces-TapoutNumberBold.ttf
          - Fraunces-TapoutTitleBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TapoutWidgets/TapoutWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.raphymuthu.tapout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raphymuthu.tapout.widgets
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Tapout:
    build:
      targets:
        Tapout: all
        TapoutTests: [test]
    test:
      targets:
        - TapoutTests
