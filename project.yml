name: Tapout
options:
  bundleIdPrefix: com.raphymuthu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Tapout:
    type: application
    platform: iOS
    sources:
      - path: Tapout
    info:
      path: Tapout/Info.plist
      properties:
        CFBundleDisplayName: Tapout
        UILaunchScreen:
          UIColorName: bg
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raphymuthu.tapout
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: "" # app icon arrives with the AppIcon screen
  TapoutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TapoutTests
    dependencies:
      - target: Tapout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raphymuthu.tapout.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tapout:
    build:
      targets:
        Tapout: all
        TapoutTests: [test]
    test:
      targets:
        - TapoutTests
